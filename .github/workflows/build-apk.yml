name: Build ELVANOQ Roku Sim APK
on:
  push:
    branches: [roku-sim]
  workflow_dispatch:
permissions:
  contents: write
env:
  BRS_ENGINE_TAG: v2.7.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache do motor brs-engine
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: engine-out
          key: brs-engine-${{ env.BRS_ENGINE_TAG }}-v1
      - name: Compilar o motor (brs-engine + brs-scenegraph, MIT)
        if: steps.cache-engine.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          {
          git clone --depth 1 --branch "$BRS_ENGINE_TAG" https://github.com/lvcabral/brs-engine.git brs-engine
          cd brs-engine
          npm install --no-audit --no-fund
          npm run release -w brs-engine
          mkdir -p packages/node/bin packages/node/assets
          npm run release -w brs-scenegraph
          mkdir -p ../engine-out/lib ../engine-out/assets
          cp packages/browser/lib/brs.api.js packages/browser/lib/brs.worker.js packages/browser/lib/brs-sg.js ../engine-out/lib/
          cp packages/browser/lib/*.LICENSE.txt ../engine-out/lib/ 2>/dev/null || true
          cp packages/browser/assets/common.zip ../engine-out/assets/
          cp LICENSE ../engine-out/LICENSE-brs-engine.txt
          ls -la ../engine-out/lib ../engine-out/assets
          } 2>&1 | tee "$GITHUB_WORKSPACE/engine.log" | tail -c 200000
      - name: Colocar o motor nos assets
        run: |
          mkdir -p assets/web/lib assets/web/assets
          cp engine-out/lib/* assets/web/lib/
          cp engine-out/assets/common.zip assets/web/assets/
          cp engine-out/LICENSE-brs-engine.txt assets/web/
      - name: SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Validar JavaScript
        run: |
          node --check assets/web/sim.js
          node --check assets/web/lib/brs.api.js
      - name: Build
        run: |
          set -o pipefail
          ./build.sh ${{ github.run_number }} 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ELVANOQ-Roku-Sim
          path: build/ELVANOQ-Roku-Sim.apk
      - name: Publicar na branch apk
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build.log 2>/dev/null || echo "build não rodou" > /tmp/out/build.log
          if [ -f engine.log ]; then tail -c 300000 engine.log > /tmp/out/engine.log; fi
          if [ -f build/ELVANOQ-Roku-Sim.apk ]; then
            cp build/ELVANOQ-Roku-Sim.apk /tmp/out/
            sha256sum build/ELVANOQ-Roku-Sim.apk > /tmp/out/SHA256.txt
            echo "ok" > /tmp/out/STATUS
          else
            echo "falhou" > /tmp/out/STATUS
          fi
          echo "run ${{ github.run_number }} · commit ${GITHUB_SHA} · brs-engine ${BRS_ENGINE_TAG}" > /tmp/out/BUILD.txt
          # publica sem mexer na pasta de trabalho (o cache do motor é salvo depois)
          export GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE=/tmp/out GIT_INDEX_FILE=/tmp/apk-index
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "APK run ${{ github.run_number }} ($(cat /tmp/out/STATUS))")
          git push -f origin "$COMMIT:refs/heads/roku-sim-apk"
